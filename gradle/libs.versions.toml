[versions]
agp = "8.6.1"
converterGson = "2.9.0"
coreTesting = "2.1.0"
datastorePreferences = "1.0.0"
glide = "4.15.1"
kotlin = "1.9.0"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
kotlinxCoroutinesAndroid = "1.7.2"
